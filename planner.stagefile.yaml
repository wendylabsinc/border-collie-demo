version: 1
stages:
  - name: planner
    from: python:3.12-slim
    workdir: /app
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    install:
      pip:
        - packages:
            - "fastapi>=0.115,<1"
            - "httpx>=0.27,<1"
            - "pydantic>=2.9,<3"
            - "uvicorn>=0.30,<1"
    copy:
      - from: local
        paths:
          - src/robotkit/__init__.py
          - src/robotkit/client.py
          - src/robotkit/contracts.py
          - src/robotkit/fruits.py
          - src/robotkit/runtime.py
        dest: /app/src/robotkit/
      - from: local
        paths:
          - src/robotkit/planner/__init__.py
          - src/robotkit/planner/logic.py
          - src/robotkit/planner/service.py
        dest: /app/src/robotkit/planner/
    user: "65532:65532"
    cmd: [python, -m, robotkit.planner.service]
