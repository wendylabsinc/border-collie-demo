version: 1
stages:
  - name: planner
    from: python:3.12-slim
    workdir: /app
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    install:
      pip:
        - packages:
            - "fastapi>=0.115,<1"
            - "httpx>=0.27,<1"
            - "pydantic>=2.9,<3"
            - "uvicorn>=0.30,<1"
    copy:
      # The exact glob keeps Wendy's watch fingerprint scoped to these paths:
      # COPY resolves s[r]c as src, without a broad !src/ ancestor allowlist.
      - from: local
        paths:
          - s[r]c/robotkit/__init__.py
          - s[r]c/robotkit/client.py
          - s[r]c/robotkit/contracts.py
          - s[r]c/robotkit/fruits.py
          - s[r]c/robotkit/runtime.py
        dest: /app/src/robotkit/
      - from: local
        paths:
          - s[r]c/robotkit/planner
        dest: /app/src/robotkit/planner/
    user: "65532:65532"
    cmd: [python, -m, robotkit.planner.service]
