<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f1eee7">
    <title>Border Collie Demo · Wendy</title>
    <style>
      :root{--cream:#f1eee7;--slate:#171c23;--muted:#5b5a56;--line:#d7d5cf;--seafoam:#9fe2bf;--green:#2a7050;--danger:#a63c2d;font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--slate)}
      *{box-sizing:border-box}body{margin:0;min-height:100vh}main{margin:auto;max-width:1120px;padding:clamp(28px,5vw,72px)}
      .brand{align-items:center;border-bottom:1px solid var(--line);display:flex;gap:14px;padding-bottom:24px}.mark{height:32px;position:relative;transform:rotate(45deg);width:32px}.mark:before{border:6px solid var(--slate);content:"";inset:0;position:absolute}.mark:after{background:var(--slate);content:"";height:21px;left:17px;position:absolute;top:-6px;width:21px}.brand strong{font-size:17px;letter-spacing:.08em}.brand .home{margin-left:auto}
      .hero{border-bottom:1px solid var(--line);padding:64px 0 52px}.eyebrow{color:var(--green);font:600 12px/1.2 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(52px,8vw,92px);font-weight:500;letter-spacing:-.055em;line-height:.94;margin:18px 0}.lede{color:var(--muted);font-size:clamp(18px,2.2vw,24px);line-height:1.45;max-width:720px}
      .safety{background:#eadcc7;color:#70461f;font-weight:600;margin-top:28px;padding:14px 16px}.actions{display:flex;flex-wrap:wrap;gap:12px;padding-top:30px}button,a{align-items:center;border:0;border-radius:0;display:inline-flex;font:650 16px/1.2 inherit;justify-content:center;min-height:52px;padding:14px 20px;text-decoration:none}button{cursor:pointer}.activate{background:var(--seafoam);color:var(--slate)}.stop{background:var(--danger);color:#fff}.secondary{background:transparent;border:1px solid var(--line);color:var(--slate)}button:disabled{cursor:not-allowed;opacity:.46}
      @media(max-width:640px){main{padding:24px}.hero{padding:48px 0 36px}.actions>*{width:100%}}
    </style>
  </head>
  <body>
    <main>
      <header class="brand"><span class="mark" aria-hidden="true"></span><strong>WENDY</strong><a class="secondary home" href="http://127.0.0.1:8088/">← Home</a></header>
      <section class="hero">
        <p class="eyebrow">Woof · Robot demo</p>
        <h1>Border Collie<br>Fruit Demo</h1>
        <p class="lede">Woof finds a selected fruit, approaches it, performs the action, and returns Home.</p>
        <p class="safety">Hardware control surface — keep the robot supervised and the operating area clear.</p>
      </section>
      <div class="actions">
        <button class="activate" type="button" disabled>Activation unavailable</button>
        <button class="stop" id="stop" type="button">Stop now</button>
        <a class="secondary" href="/debug">Open diagnostics ↗</a>
      </div>
    </main>
    <script>
      document.querySelector('#stop').addEventListener('click', async () => {
        await fetch('/api/stop', {method: 'POST'});
      });
    </script>
  </body>
</html>
