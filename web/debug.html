<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f1eee7">
    <title>Border Collie Diagnostics · Wendy</title>
    <style>
      :root {
        --wendy-cream: #f1eee7;
        --wendy-slate: #171c23;
        --wendy-seafoam: #9fe2bf;
        --wendy-green: #2a7050;
        --wendy-border: #d7d5cf;
        --wendy-danger: #a63c2d;
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
        background: var(--wendy-cream);
        color: var(--wendy-slate);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--wendy-cream);
      }
      main {
        max-width: 72rem;
        margin: 0 auto;
        min-width: 0;
        padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
      }
      .suite-header { align-items: center; border-bottom: 1px solid var(--wendy-border); display: flex; gap: 0.75rem; padding-bottom: 1rem; }
      .brand { font-weight: 750; letter-spacing: 0.12em; }
      .mark { border: 4px solid var(--wendy-slate); display: inline-block; height: 1.3rem; transform: rotate(45deg); width: 1.3rem; }
      .room-home, .back-demo {
        align-items: center;
        border: 1px solid var(--wendy-border);
        color: var(--wendy-slate);
        display: inline-flex;
        font-weight: 700;
        justify-content: center;
        min-height: 48px;
        padding: 0.65rem 1rem;
        text-decoration: none;
      }
      .room-home { margin-left: auto; }
      h1 { font-size: clamp(2.3rem, 7vw, 4.5rem); font-weight: 560; letter-spacing: -0.05em; line-height: 1; }
      #run-summary {
        padding: 1rem;
        border: 1px solid var(--wendy-border);
        background: #fffdf8;
      }
      #run-artifacts {
        padding: 1rem;
        border: 1px solid var(--wendy-border);
      }
      #artifact-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      #stages {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: 0.75rem;
        margin: 1rem 0 2rem;
      }
      .stage {
        padding: 1rem;
        border: 1px solid var(--wendy-border);
        min-width: 0;
      }
      .stage h2 {
        margin-top: 0;
        font-size: 1rem;
      }
      .stage pre,
      #status {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .COMPLETED { border-color: #2e9d55; }
      .FAILED { border-color: #d54a4a; }
      .NOT_RUN { opacity: 0.7; }
      pre { max-width: 100%; overflow-x: auto; }
    </style>
  </head>
  <body>
    <main>
      <header class="suite-header">
        <span class="mark" aria-hidden="true"></span>
        <span class="brand">WENDY</span>
        <a class="room-home" href="http://127.0.0.1:8088/">← Home</a>
      </header>
      <h1>Demo diagnostics</h1>
      <p id="run-summary" role="status">Loading latest Run Result…</p>
      <section id="run-artifacts" hidden>
        <h2>Run evidence</h2>
        <p id="artifact-help"></p>
        <div id="artifact-links"></div>
      </section>
      <section id="stages" aria-label="Demo stage results"></section>
      <details>
        <summary>Live mission and hardware status</summary>
        <pre id="status">Loading…</pre>
      </details>
      <p><a class="back-demo" href="/">← Back to demo</a></p>
    </main>
    <script>
      const runSummary = document.querySelector('#run-summary');
      const stages = document.querySelector('#stages');
      const status = document.querySelector('#status');
      const runArtifacts = document.querySelector('#run-artifacts');
      const artifactHelp = document.querySelector('#artifact-help');
      const artifactLinks = document.querySelector('#artifact-links');

      function renderStage(stage) {
        const card = document.createElement('article');
        card.className = `stage ${stage.status}`;
        const heading = document.createElement('h2');
        heading.textContent = stage.phase.replaceAll('_', ' ');
        const result = document.createElement('strong');
        result.textContent = stage.status;
        const evidence = document.createElement('pre');
        evidence.textContent = stage.evidence
          ? JSON.stringify(stage.evidence, null, 2)
          : 'No evidence recorded.';
        card.append(heading, result, evidence);
        return card;
      }

      function renderArtifacts(run) {
        const artifacts = run.artifacts || [];
        runArtifacts.hidden = false;
        artifactLinks.replaceChildren();
        if (!artifacts.length) {
          artifactHelp.textContent = run.evidence_capture?.unavailable_reason
            || 'No terminal evidence was recorded for this run.';
          return;
        }
        artifactHelp.textContent =
          'Label raw frames in Fieldmark by downloading evidence.zip, ' +
          'extracting frames/*.jpg, and uploading those images.';
        for (const artifact of artifacts) {
          const link = document.createElement('a');
          link.href = `/api/results/${run.run_id}/artifacts/` +
            encodeURIComponent(artifact.filename);
          link.textContent = artifact.filename === 'evidence.zip'
            ? 'Download raw evidence frames'
            : 'View terminal model frame';
          artifactLinks.append(link);
        }
      }

      async function refresh() {
        try {
          const [statusResponse, diagnosticResponse] = await Promise.all([
            fetch('/api/status', {cache: 'no-store'}),
            fetch('/api/diagnostics/stages', {cache: 'no-store'}),
          ]);
          if (!statusResponse.ok || !diagnosticResponse.ok) {
            throw new Error('Diagnostic API is unavailable.');
          }
          const [live, diagnostic] = await Promise.all([
            statusResponse.json(),
            diagnosticResponse.json(),
          ]);
          status.textContent = JSON.stringify(live, null, 2);
          if (diagnostic.latest_run) {
            const run = diagnostic.latest_run;
            runSummary.textContent =
              `Run ${run.run_id} — ${run.outcome || 'RUNNING'} — ` +
              `${run.reason || 'in progress'}`;
            renderArtifacts(run);
          } else {
            runSummary.textContent = 'No Demo Run has been recorded yet.';
            runArtifacts.hidden = true;
          }
          stages.replaceChildren(...diagnostic.stages.map(renderStage));
        } catch (error) {
          runSummary.textContent = error.message;
        }
      }
      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
