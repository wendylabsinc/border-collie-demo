<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Border Collie Diagnostics</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 1rem;
      }
      main {
        max-width: 72rem;
        margin: 0 auto;
      }
      #run-summary {
        padding: 1rem;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
      }
      #run-artifacts {
        padding: 1rem;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        border-radius: 0.5rem;
      }
      #artifact-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .evidence-image {
        flex: 1 1 24rem;
        margin: 0;
      }
      .evidence-image img {
        display: block;
        width: 100%;
        max-width: 48rem;
        height: auto;
        margin-top: 0.5rem;
        border-radius: 0.5rem;
      }
      #stages {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: 0.75rem;
        margin: 1rem 0 2rem;
      }
      .stage {
        padding: 1rem;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        border-radius: 0.5rem;
      }
      .stage h2 {
        margin-top: 0;
        font-size: 1rem;
      }
      .stage pre,
      #status {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .COMPLETED { border-color: #2e9d55; }
      .FAILED { border-color: #d54a4a; }
      .NOT_RUN { opacity: 0.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>Demo diagnostics</h1>
      <p id="run-summary" role="status">Loading latest Run Result…</p>
      <section id="run-artifacts" hidden>
        <h2>Run evidence</h2>
        <p id="artifact-help"></p>
        <div id="artifact-links"></div>
      </section>
      <section id="stages" aria-label="Demo stage results"></section>
      <details>
        <summary>Live mission and hardware status</summary>
        <pre id="status">Loading…</pre>
      </details>
      <p><a href="/">Back to demo</a></p>
    </main>
    <script>
      const runSummary = document.querySelector('#run-summary');
      const stages = document.querySelector('#stages');
      const status = document.querySelector('#status');
      const runArtifacts = document.querySelector('#run-artifacts');
      const artifactHelp = document.querySelector('#artifact-help');
      const artifactLinks = document.querySelector('#artifact-links');

      function renderStage(stage) {
        const card = document.createElement('article');
        card.className = `stage ${stage.status}`;
        const heading = document.createElement('h2');
        heading.textContent = stage.phase.replaceAll('_', ' ');
        const result = document.createElement('strong');
        result.textContent = stage.status;
        const evidence = document.createElement('pre');
        evidence.textContent = stage.evidence
          ? JSON.stringify(stage.evidence, null, 2)
          : 'No evidence recorded.';
        card.append(heading, result, evidence);
        return card;
      }

      function renderArtifacts(run) {
        const artifacts = run.artifacts || [];
        runArtifacts.hidden = false;
        artifactLinks.replaceChildren();
        if (!artifacts.length) {
          artifactHelp.textContent = run.evidence_capture?.unavailable_reason
            || 'No terminal evidence was recorded for this run.';
          return;
        }
        artifactHelp.textContent =
          'Label raw frames in Fieldmark by downloading evidence.zip, ' +
          'extracting frames/*.jpg, and uploading those images.';
        for (const artifact of artifacts) {
          const link = document.createElement('a');
          link.href = `/api/results/${run.run_id}/artifacts/` +
            encodeURIComponent(artifact.filename);
          link.textContent = artifact.kind === 'lie_down'
            ? 'Open lie-down fruit-position photo'
            : artifact.filename === 'evidence.zip'
              ? 'Download raw evidence frames'
              : 'View terminal model frame';
          if (artifact.kind === 'lie_down') {
            const figure = document.createElement('figure');
            figure.className = 'evidence-image';
            const img = document.createElement('img');
            img.src = link.href;
            img.alt = 'Fruit position in Woof camera view after lying down';
            img.loading = 'lazy';
            const caption = document.createElement('figcaption');
            caption.textContent = 'Fruit position when Woof lay down';
            figure.append(link, img, caption);
            artifactLinks.append(figure);
          } else {
            artifactLinks.append(link);
          }
        }
      }

      async function refresh() {
        try {
          const [statusResponse, diagnosticResponse] = await Promise.all([
            fetch('/api/status', {cache: 'no-store'}),
            fetch('/api/diagnostics/stages', {cache: 'no-store'}),
          ]);
          if (!statusResponse.ok || !diagnosticResponse.ok) {
            throw new Error('Diagnostic API is unavailable.');
          }
          const [live, diagnostic] = await Promise.all([
            statusResponse.json(),
            diagnosticResponse.json(),
          ]);
          status.textContent = JSON.stringify(live, null, 2);
          if (diagnostic.latest_run) {
            const run = diagnostic.latest_run;
            runSummary.textContent =
              `Run ${run.run_id} — ${run.outcome || 'RUNNING'} — ` +
              `${run.reason || 'in progress'}`;
            renderArtifacts(run);
          } else {
            runSummary.textContent = 'No Demo Run has been recorded yet.';
            runArtifacts.hidden = true;
          }
          stages.replaceChildren(...diagnostic.stages.map(renderStage));
        } catch (error) {
          runSummary.textContent = error.message;
        }
      }
      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
