version: 1
stages:
  - name: media
    from: dustynv/pytorch:2.7-r36.4.0-cu128-24.04
    workdir: /app
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PYTHONPATH: /usr/local/lib/python3.12/site-packages
      PYTHONUNBUFFERED: "1"
      UNITREE_ROBOT_IP: 192.168.123.161
      PEAR_MODEL_PATH: /media/model.engine
      BANANA_SPECIALIST_MODEL_PATH: /media/banana-specialist.pt
      BANANA_SPECIALIST_MIN_CONFIDENCE: "0.55"
      BANANA_SPECIALIST_MIN_IOU: "0.10"
      COCO_TEST_MODEL_PATH: /models/yolo11n.pt
      MANGO_MODEL_PATH: /models/yolo11n.pt
      BORDER_COLLIE_MANGO_RAW_CONFIDENCE: "0.08"
      BORDER_COLLIE_MANGO_COLOR_CONFIDENCE: "0.80"
      COCO_TEST_INTERVAL_S: "0.5"
      BORDER_COLLIE_MEDIA_PORT: "8111"
      BORDER_COLLIE_BARK_UUID: 161387de-21ab-4f0b-b4e9-97124b000d06
    install:
      apt:
        packages:
          - build-essential
          - ca-certificates
          - libffi8
          - libgl1
          - libglib2.0-0
          - libportaudio2
          - libsrtp2-1
          - libssl3
          - portaudio19-dev
      pip:
        - requirements: requirements.txt
          index: https://pypi.org/simple
          buildPackages: [build-essential, portaudio19-dev]
    download:
      - url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt
        sha256: 0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1
        dest: /models/yolo11n.pt
    copy:
      - from: local
        paths: [model/model.engine]
        dest: /media/model.engine
      - from: local
        paths: [model/banana-specialist.pt]
        dest: /media/banana-specialist.pt
      - from: local
        paths: [__init__.py, coco_tester.py, fruit_color.py, model_router.py, perception_sidecar.py]
        dest: /app/media/
    user: root
    cmd: [uvicorn, media.perception_sidecar:app, --host, 0.0.0.0, --port, "8111"]
