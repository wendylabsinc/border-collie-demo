# Plain Docker Compose does not compile Stagefiles. Overlay the equivalent
# Dockerfiles for local development; Wendy deployment uses docker-compose.yml.
services:
  world-state:
    build:
      context: .
      dockerfile: Dockerfile

  yolo-fruits:
    build:
      context: .
      dockerfile: Dockerfile.yolo
    command: ["python3", "-m", "robotkit.perception.yolo"]

  lidar-voxel:
    build:
      context: .
      dockerfile: Dockerfile.lidar
    command: ["python3", "-m", "robotkit.perception.lidar_voxel"]

  transcription:
    build:
      context: .
      dockerfile: Dockerfile.transcription
    command: ["python3", "-m", "robotkit.perception.transcription", "--mode", "ros2"]

  website-command:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "robotkit.perception.website"]

  health-high-low:
    build:
      context: .
      dockerfile: Dockerfile.high-low

  planner:
    build:
      context: .
      dockerfile: Dockerfile

  controller:
    build:
      context: .
      dockerfile: Dockerfile

  executor:
    build:
      context: .
      dockerfile: Dockerfile.ros2
