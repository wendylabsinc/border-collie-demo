version: 1
stages:
  - name: controller
    from: python:3.12-slim
    workdir: /app
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    install:
      pip:
        - packages:
            - "fastapi>=0.115,<1"
            - "httpx>=0.27,<1"
            - "pydantic>=2.9,<3"
            - "uvicorn>=0.30,<1"
    copy:
      - from: local
        paths:
          - src/robotkit/__init__.py
          - src/robotkit/client.py
          - src/robotkit/contracts.py
          - src/robotkit/runtime.py
        dest: /app/src/robotkit/
      - from: local
        paths:
          - src/robotkit/controller/__init__.py
          - src/robotkit/controller/logic.py
          - src/robotkit/controller/service.py
        dest: /app/src/robotkit/controller/
      - from: local
        paths:
          - src/robotkit/executor/__init__.py
          - src/robotkit/executor/mission.py
        dest: /app/src/robotkit/executor/
    user: "65532:65532"
    cmd: [python, -m, robotkit.controller.service]
