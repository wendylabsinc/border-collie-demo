services:
  world-state:
    build: .
    command: ["uvicorn", "robotkit.world_state.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      ROBOTKIT_DB_PATH: /data/world-state.sqlite3
    ports:
      - "8080:8080"
    network_mode: host
    volumes:
      - robotkit-world-state:/data
    restart: unless-stopped

  yolo-fruits:
    build:
      context: .
      dockerfile: yolo.stagefile.yaml
    environment:
      WORLD_STATE_URL: http://127.0.0.1:8080
      # Read JPEG frames through the Go2's ROS 2-compatible DDS video service.
      YOLO_INPUT_MODE: go2_dds
      GO2_NETWORK_INTERFACE: enP8p1s0
      GO2_VIDEO_TIMEOUT_SECONDS: "3"
      YOLO_INTERVAL_SECONDS: "0.2"
      YOLO_FRAME_ID: camera_link
      # Open-vocabulary YOLOE is prompted once with YOLO_CLASSES at startup.
      YOLO_MODEL: yoloe-11m-seg.pt
      # The Stagefile pins the JetPack-compatible CUDA stack. Keep inference
      # off the CPU so perception cannot starve motion-command renewals.
      YOLO_DEVICE: "0"
      # Preserve canonical fruit labels while giving YOLOE embeddings that
      # match the small plastic fruit used by this deployment.
      YOLO_PROMPT_TEMPLATES: "{name},toy {name}"
      YOLO_IMAGE_SIZE: "1280"
      # The Go2 camera is wide-angle; approach still requires a corresponding
      # fresh LIDAR range, so this recall-oriented threshold cannot drive blind.
      YOLO_CONFIDENCE: "0.15"
      YOLO_CLASSES: apple,banana,grapes,orange,pear
      ROBOTKIT_PRODUCER_ID: yoloe-fruits
      ROBOTKIT_DEPLOYMENT_GENERATION: "1"
    network_mode: host
    volumes:
      - robotkit-model-cache:/models
    depends_on:
      - world-state
    restart: unless-stopped

  lidar-voxel:
    build:
      context: .
      dockerfile: lidar.stagefile.yaml
    environment:
      WORLD_STATE_URL: http://127.0.0.1:8080
      LIDAR_POINT_CLOUD_TOPIC: /utlidar/cloud
      LIDAR_ODOMETRY_TOPIC: /utlidar/robot_odom
      LIDAR_POINTS_FRAME: sensor
      LIDAR_MOUNT_PITCH_RAD: "0.2268928"
      LIDAR_MOUNT_X_M: "0.16143"
      LIDAR_MOUNT_Y_M: "0.0"
      LIDAR_MOUNT_Z_M: "0.12262"
      ROBOTKIT_PRODUCER_ID: go2-lidar-voxel
      ROBOTKIT_DEPLOYMENT_GENERATION: "1"
    network_mode: host
    depends_on:
      - world-state
    restart: unless-stopped

  transcription:
    build:
      context: .
      dockerfile: transcription.stagefile.yaml
    environment:
      WORLD_STATE_URL: http://127.0.0.1:8080
      ROS_AUDIO_TOPIC: /audio/audio
      WHISPER_MODEL: small.en
      ROBOTKIT_PRODUCER_ID: go2-voice-transcription
      ROBOTKIT_DEPLOYMENT_GENERATION: "1"
    network_mode: host
    volumes:
      - robotkit-model-cache:/models
    depends_on:
      - world-state
    restart: unless-stopped

  website-command:
    build:
      context: .
      dockerfile: website.stagefile.yaml
    environment:
      WORLD_STATE_URL: http://127.0.0.1:8080
      WEB_PORT: "8090"
      ROBOTKIT_PRODUCER_ID: go2-website-command
      ROBOTKIT_DEPLOYMENT_GENERATION: "1"
      ROBOTKIT_MISSION_TARGETS: apple,banana,grapes,orange,pear
    network_mode: host
    depends_on:
      - world-state
    restart: unless-stopped

  health-high-low:
    build:
      context: .
      dockerfile: high-low.stagefile.yaml
    environment:
      WORLD_STATE_URL: http://127.0.0.1:8080
      ROS2_TEMPERATURE_TOPIC: /temperature
      ROS2_BATTERY_TOPIC: /battery_state
      ROBOTKIT_PRODUCER_ID: go2-health-high-low
      ROBOTKIT_DEPLOYMENT_GENERATION: "1"
    network_mode: host
    depends_on:
      - world-state
    restart: unless-stopped

  planner:
    build:
      context: .
      dockerfile: planner.stagefile.yaml
    command: ["python", "-m", "robotkit.planner.service"]
    environment:
      WORLD_STATE_URL: http://127.0.0.1:8080
      ROBOTKIT_DEPLOYMENT_GENERATION: "1"
      GOAL_TTL_SECONDS: "30"
    network_mode: host
    depends_on:
      - world-state
    restart: unless-stopped

  controller:
    build:
      context: .
      dockerfile: controller.stagefile.yaml
    command: ["python", "-m", "robotkit.controller.service"]
    environment:
      WORLD_STATE_URL: http://127.0.0.1:8080
      ROBOTKIT_DEPLOYMENT_GENERATION: "1"
      INTERVAL_SECONDS: "0.1"
      CONTROL_RENEWAL_SECONDS: "0.1"
      # One full search sweep takes about eight seconds before accounting for
      # the Go2's acceleration and hardware response.
      SEARCH_ANGULAR_RPS: "0.8"
      # Several perception streams update between controller publication and
      # executor validation. Time/freshness safety is still bounded by the
      # one-second effect TTL and each decision's required streams.
      MAX_STATE_DRIFT: "32"
      HOME_X_M: "0"
      HOME_Y_M: "0"
      HOME_YAW_RAD: "0"
      APPLE_STOP_DISTANCE_M: "0.30"
    network_mode: host
    depends_on:
      - world-state
      - planner
    restart: unless-stopped

  executor:
    build:
      context: .
      dockerfile: executor.stagefile.yaml
    environment:
      WORLD_STATE_URL: http://127.0.0.1:8080
      ROBOTKIT_EXECUTOR_MODE: unitree_sport
      INTERVAL_SECONDS: "0.05"
      GO2_NETWORK_INTERFACE: enP8p1s0
      UNITREE_MOTION_WATCHDOG_SECONDS: "0.8"
      BARK_WAV_PATH: /opt/robotkit/assets/bark.wav
    network_mode: host
    depends_on:
      - world-state
      - controller
    restart: unless-stopped

volumes:
  robotkit-world-state:
  robotkit-model-cache:
