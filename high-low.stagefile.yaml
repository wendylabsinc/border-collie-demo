version: 1
stages:
  - name: high-low
    from: ros:humble-ros-base
    workdir: /app
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    install:
      apt:
        packages: [python3-pip, ros-humble-sensor-msgs]
      pip:
        - packages:
            - "fastapi>=0.115,<1"
            - "httpx>=0.27,<1"
            - "pydantic>=2.9,<3"
            - "uvicorn>=0.30,<1"
    copy:
      # The exact glob keeps Wendy's watch fingerprint scoped to these paths:
      # COPY resolves s[r]c as src, without a broad !src/ ancestor allowlist.
      - from: local
        paths:
          - s[r]c/robotkit/__init__.py
          - s[r]c/robotkit/client.py
          - s[r]c/robotkit/contracts.py
          - s[r]c/robotkit/runtime.py
        dest: /app/src/robotkit/
      - from: local
        paths: ["s[r]c/robotkit/perception/__init__.py"]
        dest: /app/src/robotkit/perception/__init__.py
      - from: local
        paths:
          - s[r]c/robotkit/perception/high_low
        dest: /app/src/robotkit/perception/high_low/
    entrypoint:
      source: /opt/ros/humble/setup.bash
      exec: [python3, -m, robotkit.perception.high_low.service]
    user: root
