[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotkit"
version = "0.1.0"
description = "A modular, auditable perception-planning-action stack for a Unitree Go2 on Wendy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robotkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
