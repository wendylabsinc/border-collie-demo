[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "border-collie-demo"
version = "0.1.0"
description = "Clean-room Border Collie routine for the Unitree Go2"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
robot = [
  "cyclonedds==0.10.2",
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<5",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
border-collie-demo = "border_collie_demo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
